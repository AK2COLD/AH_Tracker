<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" rx="28" fill="#0d0a1a"/>
  <!-- Outer rune circle -->
  <circle cx="96" cy="96" r="78" fill="none" stroke="#4fc3f7" stroke-width="1.5" opacity="0.3"/>
  <!-- Inner rune ring -->
  <circle cx="96" cy="96" r="56" fill="none" stroke="#4fc3f7" stroke-width="1" opacity="0.2"/>
  <!-- Cross lines -->
  <line x1="24" y1="96" x2="168" y2="96" stroke="#4fc3f7" stroke-width="1" opacity="0.25"/>
  <line x1="96" y1="24" x2="96" y2="168" stroke="#4fc3f7" stroke-width="1" opacity="0.25"/>
  <line x1="40" y1="40" x2="152" y2="152" stroke="#4fc3f7" stroke-width="0.8" opacity="0.18"/>
  <line x1="152" y1="40" x2="40" y2="152" stroke="#4fc3f7" stroke-width="0.8" opacity="0.18"/>
  <!-- Flask body -->
  <path d="M80 52 L80 80 L57 112 A34 34 0 0 0 135 112 L112 80 L112 52 Z"
        fill="#4fc3f7" opacity="0.12"/>
  <path d="M80 52 L80 80 L57 112 A34 34 0 0 0 135 112 L112 80 L112 52 Z"
