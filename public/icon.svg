  <!-- Gold coin dot -->
  <circle cx="96" cy="108" r="7" fill="#f4b942" opacity="0.9"/>
  <circle cx="96" cy="108" r="4" fill="#f4b942"/>
  <!-- Stars -->
  <circle cx="40" cy="38" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="155" cy="52" r="1" fill="white" opacity="0.5"/>
  <circle cx="148" cy="145" r="1.2" fill="#4fc3f7" opacity="0.6"/>
  <circle cx="38" cy="150" r="1" fill="#f4b942" opacity="0.5"/>
</svg>
